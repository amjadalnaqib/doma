<body class="bg-slate-50 text-right">

<!-- 🔥 الهيدر (نفس موقعك) -->

<div class="flex flex-row-reverse justify-between items-center w-full max-w-7xl mx-auto px-10 py-4">

<nav class="hidden md:flex flex-row-reverse items-center gap-6">

</button>

</div>
</header>

<!-- 🔥 المحتوى -->
<div class="max-w-3xl mx-auto mt-16 bg-white p-8 rounded-xl shadow">

<h1 class="text-3xl font-bold text-emerald-900 text-center mb-4">
اتصل بنا
</h1>

<p class="text-center text-gray-500 mb-8">
نحن هنا للإجابة على استفساراتك، لا تتردد في التواصل معنا
</p>

<form onsubmit="sendMessage(event)" class="space-y-4">

<input type="text" placeholder="الاسم"
class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" required>

<input type="email" placeholder="البريد الإلكتروني"
class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" required>

<textarea placeholder="اكتب رسالتك هنا..."
class="w-full p-3 border border-gray-300 rounded-lg h-32 focus:outline-none focus:ring-2 focus:ring-emerald-500" required></textarea>

<button type="submit"
class="w-full bg-emerald-800 text-white py-3 rounded-lg hover:bg-emerald-700 transition">
إرسال
</button>

</form>

<div class="mt-8 text-center text-gray-600">
<p>📍 صنعاء - اليمن</p>
<p>📞 777000000</p>
<p>📧 example@email.com</p>
</div>

</div>

<!-- 🔥 سكربت -->
<script>
function sendMessage(e) {
    e.preventDefault();
    alert("تم إرسال رسالتك بنجاح ✅");
}
</script>
